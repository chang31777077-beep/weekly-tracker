<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 備考週計畫</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F8FAFC; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function getMondayDate(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function dateToKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function getWeekKey(date)    { return dateToKey(getMondayDate(new Date(date))); }
    function getMondayOfWeek(key){ const [y,m,d]=key.split("-").map(Number); return new Date(y,m-1,d); }
    function currentWeekKey()    { return getWeekKey(new Date()); }

    const FIXED_TASKS = [
      { id:"engmath",     text:"工程數學 45分鐘",   tag:"必做" },
      { id:"anki_make",   text:"Anki 製卡（電腦）", tag:"必做" },
      { id:"anki_review", text:"Anki 每日複習",     tag:"必做" },
    ];
    const SUNDAY_EXTRA = { id:"weekly_plan", text:"撰寫下週任務清單", tag:"週任務" };
    const DAYS = [
      { key:"mon", label:"週一", shortLabel:"一", rest:true  },
      { key:"tue", label:"週二", shortLabel:"二", rest:false },
      { key:"wed", label:"週三", shortLabel:"三", rest:false },
      { key:"thu", label:"週四", shortLabel:"四", rest:false },
      { key:"fri", label:"週五", shortLabel:"五", rest:false },
      { key:"sat", label:"週六", shortLabel:"六", rest:false },
      { key:"sun", label:"週日", shortLabel:"日", rest:false },
    ];
    const JS_DAY_TO_KEY = ["sun","mon","tue","wed","thu","fri","sat"];
    const TAG_COLORS = {
      "必做":  { bg:"#EEF2FF", text:"#4F46E5" },
      "週任務":{ bg:"#FEF3C7", text:"#D97706" },
      "自訂":  { bg:"#F0FDF4", text:"#16A34A" },
    };

    function createDefaultDay(dayKey) {
      if (dayKey === "mon") return { tasks:[], note:"", subject:"" };
      const tasks = FIXED_TASKS.map(t => ({ ...t, done:false }));
      if (dayKey === "sun") tasks.push({ ...SUNDAY_EXTRA, done:false });
      return { tasks, note:"", subject:"" };
    }

    function StudyTracker() {
      const [weekKey,     setWeekKey]     = useState(currentWeekKey);
      const [weekData,    setWeekData]    = useState(null);
      const [loading,     setLoading]     = useState(true);
      const [addingTo,    setAddingTo]    = useState(null);
      const [newText,     setNewText]     = useState({});
      const [expandedDay, setExpandedDay] = useState(null);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        try {
          const raw = localStorage.getItem(`study_${weekKey}`);
          if (!cancelled) {
            if (raw) { setWeekData(JSON.parse(raw)); }
            else { const d={}; DAYS.forEach(day=>{ d[day.key]=createDefaultDay(day.key); }); setWeekData(d); }
          }
        } catch {
          if (!cancelled) { const d={}; DAYS.forEach(day=>{ d[day.key]=createDefaultDay(day.key); }); setWeekData(d); }
        }
        setLoading(false);
        return () => { cancelled = true; };
      }, [weekKey]);

      useEffect(() => {
        if (!weekData || loading) return;
        try { localStorage.setItem(`study_${weekKey}`, JSON.stringify(weekData)); } catch {}
      }, [weekData, weekKey, loading]);

      function toggleTask(dayKey, taskId) {
        setWeekData(p => ({ ...p, [dayKey]: { ...p[dayKey], tasks: p[dayKey].tasks.map(t => t.id===taskId ? {...t,done:!t.done} : t) } }));
      }
      function addTask(dayKey) {
        const text = (newText[dayKey]||"").trim();
        if (!text) return;
        setWeekData(p => ({ ...p, [dayKey]: { ...p[dayKey], tasks:[...p[dayKey].tasks, {id:`c_${Date.now()}`,text,tag:"自訂",done:false}] } }));
        setNewText(p => ({ ...p, [dayKey]:"" }));
        setAddingTo(null);
      }
      function removeTask(dayKey, taskId) {
        setWeekData(p => ({ ...p, [dayKey]: { ...p[dayKey], tasks: p[dayKey].tasks.filter(t=>t.id!==taskId) } }));
      }
      function changeWeek(delta) {
        const mon = getMondayOfWeek(weekKey);
        mon.setDate(mon.getDate() + delta * 7);
        setWeekKey(getWeekKey(mon));
      }

      const getProgress = (dayKey) => {
        if (!weekData||!weekData[dayKey]) return {done:0,total:0};
        const t = weekData[dayKey].tasks;
        return { done:t.filter(x=>x.done).length, total:t.length };
      };
      const weekProgress = (() => {
        if (!weekData) return {done:0,total:0};
        let done=0, total=0;
        DAYS.filter(d=>!d.rest).forEach(d=>{ const p=getProgress(d.key); done+=p.done; total+=p.total; });
        return {done,total};
      })();
      const weekPct = weekProgress.total ? Math.round(weekProgress.done/weekProgress.total*100) : 0;

      const monday      = getMondayOfWeek(weekKey);
      const sunday      = new Date(monday); sunday.setDate(monday.getDate()+6);
      const fmt         = (d) => `${d.getMonth()+1}/${d.getDate()}`;
      const todayDayKey = JS_DAY_TO_KEY[new Date().getDay()];
      const isCurrWeek  = weekKey === currentWeekKey();

      if (loading) return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#F8FAFC"}}>
          <div style={{color:"#94A3B8",fontSize:14}}>載入中...</div>
        </div>
      );

      return (
        <div style={{background:"#F8FAFC",minHeight:"100vh",fontFamily:"-apple-system,'Helvetica Neue',Arial,sans-serif"}}>
          <div style={{background:"#1E293B",padding:"0 20px"}}>
            <div style={{maxWidth:720,margin:"0 auto",padding:"16px 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{color:"white",fontWeight:700,fontSize:16}}>📚 備考週計畫</div>
                <div style={{color:"#94A3B8",fontSize:12,marginTop:2}}>土木技師 × 研究所</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <button onClick={()=>changeWeek(-1)} style={{background:"#334155",border:"none",color:"#CBD5E1",borderRadius:6,padding:"6px 10px",cursor:"pointer",fontSize:13}}>←</button>
                <div style={{textAlign:"center",minWidth:100}}>
                  <div style={{color:"white",fontSize:13,fontWeight:600}}>{fmt(monday)} – {fmt(sunday)}</div>
                  {isCurrWeek && <div style={{color:"#6366F1",fontSize:11,marginTop:1}}>本週</div>}
                </div>
                <button onClick={()=>changeWeek(1)} style={{background:"#334155",border:"none",color:"#CBD5E1",borderRadius:6,padding:"6px 10px",cursor:"pointer",fontSize:13}}>→</button>
              </div>
            </div>
          </div>

          <div style={{maxWidth:720,margin:"0 auto",padding:"16px 20px"}}>
            <div style={{background:"white",borderRadius:12,padding:"16px 20px",marginBottom:16,boxShadow:"0 1px 3px rgba(0,0,0,0.06)",border:"1px solid #E2E8F0"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:13,fontWeight:600,color:"#374151"}}>本週完成率</span>
                <span style={{fontSize:13,color:"#6B7280"}}>{weekProgress.done} / {weekProgress.total} 項　
                  <span style={{fontWeight:700,color:weekPct>=80?"#059669":weekPct>=50?"#D97706":"#6366F1"}}>{weekPct}%</span>
                </span>
              </div>
              <div style={{background:"#F1F5F9",borderRadius:999,height:8,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:999,background:weekPct>=80?"#10B981":weekPct>=50?"#F59E0B":"#6366F1",width:`${weekPct}%`,transition:"width 0.4s ease"}}/>
              </div>
              <div style={{display:"flex",gap:6,marginTop:10,justifyContent:"space-between"}}>
                {DAYS.map(day => {
                  const p=getProgress(day.key); const pct=p.total?p.done/p.total:0;
                  const isToday=isCurrWeek&&day.key===todayDayKey;
                  return (
                    <div key={day.key} style={{flex:1,textAlign:"center"}}>
                      <div style={{height:6,borderRadius:999,marginBottom:4,background:day.rest?"#DCFCE7":pct===1?"#10B981":pct>0?"#6366F1":"#E2E8F0",outline:isToday?"2px solid #6366F1":"none"}}/>
                      <div style={{fontSize:10,color:isToday?"#6366F1":"#9CA3AF",fontWeight:isToday?700:400}}>{day.shortLabel}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {DAYS.map(day => {
              const data=weekData[day.key]; const prog=getProgress(day.key);
              const pct=prog.total?Math.round(prog.done/prog.total*100):0;
              const isRest=day.rest; const isToday=isCurrWeek&&day.key===todayDayKey;
              const isExpanded=expandedDay===day.key||isToday; const isAdding=addingTo===day.key;
              return (
                <div key={day.key} style={{background:"white",borderRadius:12,marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,0.06)",border:isToday?"2px solid #6366F1":isRest?"1.5px solid #DCFCE7":"1px solid #E2E8F0",overflow:"hidden"}}>
                  <div onClick={()=>!isRest&&setExpandedDay(expandedDay===day.key?null:day.key)}
                    style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:10,cursor:isRest?"default":"pointer",userSelect:"none"}}>
                    <div style={{width:36,height:36,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:isRest?"#DCFCE7":isToday?"#EEF2FF":"#F8FAFC",fontWeight:700,fontSize:14,color:isRest?"#059669":isToday?"#6366F1":"#374151"}}>
                      {day.shortLabel}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontWeight:600,fontSize:14,color:isRest?"#059669":"#1E293B"}}>{day.label}</span>
                        {isToday&&<span style={{background:"#EEF2FF",color:"#6366F1",fontSize:10,padding:"1px 7px",borderRadius:999,fontWeight:700}}>今天</span>}
                        {isRest&&<span style={{background:"#DCFCE7",color:"#059669",fontSize:10,padding:"1px 7px",borderRadius:999,fontWeight:600}}>🌿 休息日</span>}
                      </div>
                      {!isRest&&data.subject&&<div style={{fontSize:12,color:"#6B7280",marginTop:2}}>{data.subject}</div>}
                    </div>
                    {!isRest&&prog.total>0&&(
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:12,fontWeight:700,color:pct===100?"#059669":"#6B7280"}}>{pct===100?"✓":`${prog.done}/${prog.total}`}</div>
                        <div style={{width:40,height:3,background:"#F1F5F9",borderRadius:999,marginTop:3}}>
                          <div style={{height:"100%",width:`${pct}%`,background:pct===100?"#10B981":"#6366F1",borderRadius:999}}/>
                        </div>
                      </div>
                    )}
                    {!isRest&&<span style={{color:"#CBD5E1",fontSize:12}}>{isExpanded?"▲":"▼"}</span>}
                  </div>

                  {!isRest&&isExpanded&&(
                    <div style={{padding:"0 18px 16px",borderTop:"1px solid #F1F5F9"}}>
                      <input type="text" value={data.subject||""} onChange={e=>setWeekData(p=>({...p,[day.key]:{...p[day.key],subject:e.target.value}}))}
                        placeholder="今日主修科目（選填）"
                        style={{width:"100%",border:"1px solid #E2E8F0",borderRadius:8,padding:"8px 12px",fontSize:13,color:"#374151",marginTop:12,marginBottom:12,outline:"none",boxSizing:"border-box",background:"#F8FAFC"}}
                      />
                      {data.tasks.map(task => {
                        const ts=TAG_COLORS[task.tag]||TAG_COLORS["自訂"];
                        return (
                          <div key={task.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #F8FAFC"}}>
                            <div onClick={()=>toggleTask(day.key,task.id)}
                              style={{width:18,height:18,borderRadius:5,border:task.done?"none":"2px solid #CBD5E1",background:task.done?"#6366F1":"white",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                              {task.done&&<span style={{color:"white",fontSize:11,fontWeight:700}}>✓</span>}
                            </div>
                            <span style={{flex:1,fontSize:13.5,color:task.done?"#94A3B8":"#374151",textDecoration:task.done?"line-through":"none"}}>{task.text}</span>
                            <span style={{fontSize:10,padding:"1px 7px",borderRadius:999,background:ts.bg,color:ts.text,fontWeight:600,flexShrink:0}}>{task.tag}</span>
                            {task.id.startsWith("c_")&&<button onClick={()=>removeTask(day.key,task.id)} style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",fontSize:16,padding:"0 2px",lineHeight:1}}>×</button>}
                          </div>
                        );
                      })}
                      {isAdding?(
                        <div style={{display:"flex",gap:8,marginTop:10}}>
                          <input autoFocus type="text" value={newText[day.key]||""} onChange={e=>setNewText(p=>({...p,[day.key]:e.target.value}))}
                            onKeyDown={e=>{if(e.key==="Enter")addTask(day.key);if(e.key==="Escape")setAddingTo(null);}}
                            placeholder="輸入自訂任務..." style={{flex:1,border:"1px solid #6366F1",borderRadius:7,padding:"7px 11px",fontSize:13,outline:"none"}}/>
                          <button onClick={()=>addTask(day.key)} style={{background:"#6366F1",color:"white",border:"none",borderRadius:7,padding:"7px 14px",cursor:"pointer",fontSize:13,fontWeight:600}}>新增</button>
                          <button onClick={()=>setAddingTo(null)} style={{background:"#F1F5F9",border:"none",borderRadius:7,padding:"7px 10px",cursor:"pointer",fontSize:13,color:"#6B7280"}}>取消</button>
                        </div>
                      ):(
                        <button onClick={()=>setAddingTo(day.key)} style={{marginTop:10,background:"none",border:"1.5px dashed #CBD5E1",borderRadius:7,padding:"6px 14px",cursor:"pointer",fontSize:13,color:"#94A3B8",width:"100%"}}>
                          + 新增自訂任務
                        </button>
                      )}
                      <textarea value={data.note||""} onChange={e=>setWeekData(p=>({...p,[day.key]:{...p[day.key],note:e.target.value}}))}
                        placeholder="今日進度備忘、筆記..." rows={2}
                        style={{marginTop:10,width:"100%",border:"1px solid #E2E8F0",borderRadius:8,padding:"8px 12px",fontSize:12.5,color:"#374151",resize:"vertical",outline:"none",fontFamily:"inherit",boxSizing:"border-box",background:"#FAFAFA"}}
                      />
                    </div>
                  )}
                  {isRest&&(
                    <div style={{padding:"0 18px 14px"}}>
                      <p style={{fontSize:13,color:"#6B7280",margin:0,fontStyle:"italic"}}>不讀書、不製卡、不碰工程數學。出去走走、補眠、娛樂 🎮</p>
                    </div>
                  )}
                </div>
              );
            })}

            <div style={{textAlign:"center",padding:"12px 0 20px"}}>
              <p style={{fontSize:11,color:"#CBD5E1",margin:0}}>進度自動儲存 · 每週記錄獨立保存</p>
              {!isCurrWeek&&(
                <button onClick={()=>setWeekKey(currentWeekKey())} style={{marginTop:8,background:"none",border:"1px solid #E2E8F0",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontSize:12,color:"#6B7280"}}>
                  回到本週
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<StudyTracker />);
  </script>
</body>
</html>
